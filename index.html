<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" 
            rel="stylesheet"integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="css/style.css">
            <title>LAW PULS</title>
</head>
<body>
    <!-- Navbar / Sidebar -->
<aside class="sidebar">

    <div class="text-center mb-4">
        <img src="/image/logo.png" alt="Law Pulse" class="logo">
    </div>

    <div class="d-flex gap-2 mb-4">
        <button class="portal-btn active">Client</button>
        <button class="portal-btn">Lawyer</button>
        <button class="portal-btn">Admin</button>
    </div>

    <nav class="d-flex flex-column gap-2">

        <a href="#lawyers" class="nav-link-custom active">
            Find Lawyer
        </a>

        <a href="#requests" class="nav-link-custom">
            My Requests
        </a>

        <a href="#messages" class="nav-link-custom">
            Messages
        </a>

        <a href="#support" class="nav-link-custom">
            Support
        </a>

    </nav>

</aside>
        
        

    </header> 

    
                <!-- Contact -->
    <section id="contact" class="contact-section">

    <div class="container">

        <h2 class="text-center mb-4">Contact Us</h2>

        <div class="row justify-content-center">

            <div class="col-md-7">

                <form>

                    <div class="mb-3">
                        <label class="form-label">Full Name</label>
                        <input type="text" class="form-control" placeholder="Enter your name">
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Email</label>
                        <input type="email" class="form-control" placeholder="Enter your email">
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Message</label>
                        <textarea class="form-control" rows="4" placeholder="Write your message"></textarea>
                    </div>

                    <button type="submit" class="contact-btn">
                        Send Message
                    </button>

                </form>

            </div>

        </div>

    </div>

</section>
                <!-- Footer -->
    <footer class="footer">

    <div class="container">

        <div class="row align-items-center">

            <div class="col-md-4 text-center text-md-start">
                <img src="/image/logo.png" alt="Law Pulse" class="footer-logo">
            </div>

            <div class="col-md-4 text-center my-3">
                <a href="#">Find Lawyer</a>
                <a href="#">Requests</a>
                <a href="#">Contact</a>
            </div>

            <div class="col-md-4 text-center text-md-end">
                <p class="mb-0">©️ 2026 Law Pulse</p>
                <small>Your Case. Our Pulse.</small>
            </div>

        </div>

    </div>

</footer>
    
</body>
</html>
