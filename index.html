        <section id="contact" class="contact-section">

            <div class="container">

                <h2 class="text-center mb-3">
                    Contact Us
                </h2>

                <div class="row justify-content-center">

                    <div class="col-md-6">

                        <!-- Contact Form -->
                        <form>

                            <!-- Full Name -->
                            <label class="form-label">Full Name</label>

                            <input class="form-control mb-2"

                            <button class="main-btn">

                        </form>

                    </div>
