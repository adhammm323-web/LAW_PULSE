<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
       <link rel="stylesheet" href="style.css"> 

</head>
<body>

<!-- ================= Main Content ================= -->
    <main class="content">


        <!-- ================= Home Section ================= -->
        <section id="home" class="container py-4">

            <!-- Home Header -->
            <div class="white-box d-flex justify-content-between align-items-center">
                <h2 class="fw-bold mb-0">Law Pulse Web Portal</h2>
                <span>Find the right lawyer for your case.</span>
            </div>


            <!-- ================= How It Works ================= -->
            <div class="white-box mt-4">

                <h3 class="fw-bold mb-4">How it works</h3>

                <div class="row g-3">

                    <!-- Step 1 -->
                    <div class="col-md-4">
                        <div class="step-box">
                            <h5>1. Choose</h5>
                            <p>Select specialty.</p>
                        </div>
                    </div>

                    <!-- Step 2 -->
                    <div class="col-md-4">
                        <div class="step-box">
                            <h5>2. Browse</h5>
                            <p>View lawyer profiles.</p>
                        </div>
                    </div>

                    <!-- Step 3 -->
                    <div class="col-md-4">
                        <div class="step-box">
                            <h5>3. Request</h5>
                            <p>Book consultation.</p>
                        </div>
                    </div>

                </div>

                <!-- Find Lawyer Button -->
                <a href="#lawyers" class="main-btn d-inline-block mt-3">
                    Find a Lawyer Now
                </a>

            </div>
            <!-- ================= End How It Works ================= -->

        </section>
        <!-- ================= End Home Section ================= -->
         </body>
</html
